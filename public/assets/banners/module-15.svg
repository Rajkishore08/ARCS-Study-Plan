<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a071b"/>
      <stop offset="50%" stop-color="#120c2b"/>
      <stop offset="100%" stop-color="#05030e"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="1"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Isometric Build Plate Grid -->
  <g stroke="#332255" stroke-width="1.2" opacity="0.6">
    <!-- Grid Lines Matrix -->
    <path d="M140,580 L640,360 L1140,580 L640,800 Z" fill="#0d0822" stroke="#a855f7" stroke-width="2"/>
    <line x1="240" y1="536" x2="740" y2="756"/>
    <line x1="340" y1="492" x2="840" y2="712"/>
    <line x1="440" y1="448" x2="940" y2="668"/>
    <line x1="540" y1="404" x2="1040" y2="624"/>
    
    <line x1="240" y1="624" x2="740" y2="404"/>
    <line x1="340" y1="668" x2="840" y2="448"/>
    <line x1="440" y1="712" x2="940" y2="492"/>
    <line x1="540" y1="756" x2="1040" y2="536"/>
  </g>

  <!-- 3D Printed Geometric Component (Being Built) -->
  <g transform="translate(640, 480)" filter="url(#purpleGlow)">
    <!-- Base Slices -->
    <polygon points="-120,40 0,90 120,40 0,-10" fill="#1e103a" stroke="#c084fc" stroke-width="2"/>
    <polygon points="-120,20 0,70 120,20 0,-30" fill="#2e1065" stroke="#d8b4fe" stroke-width="2"/>
    <polygon points="-120,0 0,50 120,0 0,-50" fill="#3b0764" stroke="#e879f9" stroke-width="2"/>
    <polygon points="-100,-20 0,25 100,-20 0,-65" fill="#581c87" stroke="#f472b6" stroke-width="2"/>
    <polygon points="-80,-40 0,0 80,-40 0,-80" fill="#701a75" stroke="#f43f5e" stroke-width="2.5"/>

    <!-- Wireframe Mesh Top Layer -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3">
      <line x1="-80" y1="-40" x2="0" y2="-80"/>
      <line x1="0" y1="-80" x2="80" y2="-40"/>
      <line x1="80" y1="-40" x2="0" y2="0"/>
      <line x1="0" y1="0" x2="-80" y2="-40"/>
      <line x1="0" y1="-80" x2="0" y2="0"/>
      <line x1="-80" y1="-40" x2="80" y2="-40"/>
    </g>

    <!-- Hotend Nozzle and Extrusion Tip -->
    <g transform="translate(0, -90)">
      <!-- Extrusion Nozzle -->
      <polygon points="-25,-120 25,-120 12,-20 0,0 -12,-20" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
      <rect x="-35" y="-160" width="70" height="40" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="-15" y="-210" width="30" height="50" fill="#38bdf8" opacity="0.8"/>

      <!-- Molten Filament Extrusion Spot -->
      <circle cx="0" cy="0" r="14" fill="url(#heatGlow)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <line x1="0" y1="-20" x2="0" y2="10" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Gantry Rails -->
  <line x1="160" y1="220" x2="1120" y2="220" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <line x1="160" y1="240" x2="1120" y2="240" stroke="#334155" stroke-width="4"/>

  <!-- Telemetry HUD & Parameters -->
  <g font-family="monospace" fill="#d8b4fe" font-size="14">
    <!-- Top Left Parameters Box -->
    <rect x="50" y="50" width="360" height="100" rx="10" fill="#0f0926" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5"/>
    <text x="70" y="80" font-weight="bold" fill="#ffffff" font-size="16">ADDITIVE FABRICATION ENGINE</text>
    <text x="70" y="105" fill="#c084fc">NOZZLE TEMP: 215°C | BED: 60°C</text>
    <text x="70" y="125" fill="#e879f9">LAYER: 142 / 280 (0.16mm HIGH RES)</text>
    <text x="70" y="140" fill="#38bdf8" font-size="11">MATERIAL: PLA PRO HIGH-TENSILE</text>

    <!-- Top Right CAD Status -->
    <rect x="890" y="50" width="340" height="100" rx="10" fill="#0f0926" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5"/>
    <text x="910" y="80" font-weight="bold" fill="#ffffff" font-size="16">PARAMETRIC CAD PIPELINE</text>
    <text x="910" y="105" fill="#4ade80">● PROCESS: SLICING → TOOLPATH GCODE</text>
    <text x="910" y="125" fill="#94a3b8">DIMENSIONAL TOLERANCE: ±0.05mm</text>
    <text x="910" y="140" fill="#f472b6" font-size="11">RAPID PROTOTYPING & HARDWARE</text>
  </g>
</svg>
