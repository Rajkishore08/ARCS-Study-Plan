<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rainbowFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="capstoneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#nexusBg)"/>

  <!-- Orbital Rings -->
  <g transform="translate(640, 360)" filter="url(#capstoneGlow)">
    <circle cx="0" cy="0" r="280" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="10,8"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="14,6"/>
    <ellipse cx="0" cy="0" rx="300" ry="120" fill="none" stroke="url(#rainbowFlow)" stroke-width="2.5" opacity="0.8" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="300" ry="120" fill="none" stroke="url(#rainbowFlow)" stroke-width="2.5" opacity="0.8" transform="rotate(35)"/>

    <!-- Central ARCS Innovation Core -->
    <circle cx="0" cy="0" r="100" fill="url(#coreGlow)"/>
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- ARCS Emblem Center -->
    <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="4">ARCS</text>
    <text x="0" y="32" font-family="monospace" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">INTEGRATION</text>

    <!-- 7 Surrounding Technology Nodes Connected with Beams -->
    <!-- 1. AI (Top) -->
    <line x1="0" y1="-70" x2="0" y2="-220" stroke="#06b6d4" stroke-width="2"/>
    <g transform="translate(0, -220)">
      <circle cx="0" cy="0" r="32" fill="#0c1628" stroke="#06b6d4" stroke-width="2.5"/>
      <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="13" fill="#22d3ee" text-anchor="middle">AI</text>
    </g>

    <!-- 2. AR/VR (Top Right) -->
    <line x1="50" y1="-50" x2="190" y2="-110" stroke="#a855f7" stroke-width="2"/>
    <g transform="translate(190, -110)">
      <circle cx="0" cy="0" r="32" fill="#0c1628" stroke="#a855f7" stroke-width="2.5"/>
      <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="12" fill="#c084fc" text-anchor="middle">AR/VR</text>
    </g>

    <!-- 3. IoT (Bottom Right) -->
    <line x1="50" y1="50" x2="190" y2="110" stroke="#10b981" stroke-width="2"/>
    <g transform="translate(190, 110)">
      <circle cx="0" cy="0" r="32" fill="#0c1628" stroke="#10b981" stroke-width="2.5"/>
      <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="13" fill="#34d399" text-anchor="middle">IoT</text>
    </g>

    <!-- 4. Satellite (Bottom) -->
    <line x1="0" y1="70" x2="0" y2="220" stroke="#3b82f6" stroke-width="2"/>
    <g transform="translate(0, 220)">
      <circle cx="0" cy="0" r="32" fill="#0c1628" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="12" fill="#60a5fa" text-anchor="middle">SPACE</text>
    </g>

    <!-- 5. Robotics (Bottom Left) -->
    <line x1="-50" y1="50" x2="-190" y2="110" stroke="#f59e0b" stroke-width="2"/>
    <g transform="translate(-190, 110)">
      <circle cx="0" cy="0" r="32" fill="#0c1628" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="12" fill="#fbbf24" text-anchor="middle">ROBOT</text>
    </g>

    <!-- 6. Drones (Top Left) -->
    <line x1="-50" y1="-50" x2="-190" y2="-110" stroke="#38bdf8" stroke-width="2"/>
    <g transform="translate(-190, -110)">
      <circle cx="0" cy="0" r="32" fill="#0c1628" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">DRONE</text>
    </g>
  </g>

  <!-- Top Headers & Framework HUD -->
  <g font-family="monospace" fill="#38bdf8" font-size="14">
    <!-- Top Center Banner -->
    <rect x="420" y="30" width="440" height="50" rx="25" fill="#09101d" fill-opacity="0.9" stroke="url(#rainbowFlow)" stroke-width="2"/>
    <text x="640" y="62" font-family="sans-serif" font-weight="900" fill="#ffffff" font-size="16" text-anchor="middle" letter-spacing="2">
      ARCS CAPSTONE INTEGRATION
    </text>

    <!-- Left Box: Problem-First Mindset -->
    <rect x="50" y="580" width="360" height="90" rx="10" fill="#09101d" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="610" font-weight="bold" fill="#ffffff" font-size="15">THE ARCS PARADIGM</text>
    <text x="70" y="635" fill="#94a3b8">1. Identify Authentic Problem</text>
    <text x="70" y="655" fill="#38bdf8">2. Fuse Appropriate Technologies</text>

    <!-- Right Box: Outcome -->
    <rect x="870" y="580" width="360" height="90" rx="10" fill="#09101d" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
    <text x="890" y="610" font-weight="bold" fill="#ffffff" font-size="15">GRADUATION OUTCOME</text>
    <text x="890" y="635" fill="#4ade80">● End-to-End Functional MVP</text>
    <text x="890" y="655" fill="#94a3b8">From Discovery to Creation</text>
  </g>
</svg>
