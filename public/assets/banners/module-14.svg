<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- HUD Grid & Scanlines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- City / Terrain Infrastructure Silhouette -->
  <path d="M0,620 L120,580 L200,600 L320,530 L450,560 L580,480 L680,510 L800,450 L950,520 L1100,470 L1280,550 L1280,720 L0,720 Z" fill="#09101d" stroke="#0ea5e9" stroke-width="1.5" opacity="0.8"/>
  <path d="M0,660 L240,640 L480,670 L720,630 L960,650 L1280,640 L1280,720 L0,720 Z" fill="#040811"/>

  <!-- Waypoint Flight Path Curve -->
  <path d="M150,520 Q350,220 640,280 T1120,200" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="10,6" filter="url(#glow)"/>

  <!-- Waypoint Nodes -->
  <g filter="url(#glow)">
    <circle cx="150" cy="520" r="10" fill="#06b6d4"/>
    <circle cx="460" cy="270" r="7" fill="#38bdf8"/>
    <circle cx="640" cy="280" r="12" fill="#22d3ee" stroke="#ffffff" stroke-width="2"/>
    <circle cx="890" cy="210" r="7" fill="#38bdf8"/>
    <circle cx="1120" cy="200" r="10" fill="#06b6d4"/>
  </g>

  <!-- Central Autonomous Drone Illustration -->
  <g transform="translate(640, 260)" filter="url(#glow)">
    <!-- Drone Core Body -->
    <ellipse cx="0" cy="0" rx="45" ry="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#0284c7" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>

    <!-- Drone Arms -->
    <line x1="-120" y1="-50" x2="120" y2="50" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <line x1="-120" y1="50" x2="120" y2="-50" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Rotors & Spinning Discs -->
    <ellipse cx="-120" cy="-50" rx="45" ry="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.9"/>
    <ellipse cx="120" cy="-50" rx="45" ry="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.9"/>
    <ellipse cx="-120" cy="50" rx="45" ry="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.9"/>
    <ellipse cx="120" cy="50" rx="45" ry="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.9"/>

    <!-- Rotor Hubs -->
    <circle cx="-120" cy="-50" r="6" fill="#38bdf8"/>
    <circle cx="120" cy="-50" r="6" fill="#38bdf8"/>
    <circle cx="-120" cy="50" r="6" fill="#38bdf8"/>
    <circle cx="120" cy="50" r="6" fill="#38bdf8"/>

    <!-- Sensor Scan Cone / LiDAR Projection -->
    <polygon points="0,20 -180,360 180,360" fill="url(#beaconGlow)" opacity="0.35"/>
    <line x1="0" y1="20" x2="-180" y2="360" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="20" x2="180" y2="360" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Flight HUD Elements -->
  <g font-family="monospace" fill="#38bdf8" font-size="14">
    <!-- Top Left Telemetry Box -->
    <rect x="50" y="50" width="340" height="90" rx="10" fill="#09101d" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="70" y="80" font-weight="bold" fill="#ffffff" font-size="16">UAV AUTONOMOUS FLIGHT MISSION</text>
    <text x="70" y="105" fill="#38bdf8">ALTITUDE: 45.2m | SPEED: 8.5 m/s</text>
    <text x="70" y="125" fill="#22d3ee">BATTERY: 88% | GPS: 18 SATELLITES LOCK</text>

    <!-- Top Right Status Badge -->
    <rect x="910" y="50" width="320" height="90" rx="10" fill="#09101d" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="930" y="80" font-weight="bold" fill="#ffffff" font-size="16">MISSION: AERIAL SCANNING</text>
    <text x="930" y="105" fill="#4ade80">● STATUS: WAYPOINT EN ROUTE</text>
    <text x="930" y="125" fill="#94a3b8">MODE: LIDAR + THERMAL MAPPING</text>

    <!-- Target Inspection Crosshair in Scan Zone -->
    <g transform="translate(640, 560)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#ef4444" stroke-width="1.5"/>
      <text x="48" y="5" fill="#ef4444" font-weight="bold" font-size="12">TARGET POI #03: STRUCTURE DETECTED</text>
    </g>
  </g>
</svg>
